<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>offcut-director — 촬영 로거</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="flash"><span id="flashNum"></span></div>

<header>
  <div class="proj" id="hProject">오늘의 촬영</div>
  <div class="hbtns">
    <button id="btnExport" class="hbtn">보내기</button>
    <button id="btnSettings" class="hbtn">설정</button>
  </div>
</header>

<main>
  <div id="clockWrap">
    <div id="recDot"></div>
    <div id="takeLabel">STANDBY</div>
    <div id="clock">00:00:00:00</div>
    <div id="wallSub"></div>
  </div>

  <div id="controls">
    <button id="btnRoll" class="big roll"><span id="rollFill"></span><span class="rlabel">ROLL<span class="holdHint">길게 눌러 시작</span></span></button>
    <div id="rollCtl" class="hidden">
      <div class="jrow">
        <button class="jbtn keep" data-j="KEEP">특이사항</button>
        <button class="jbtn ng" data-j="NG">삭제</button>
        <button class="jbtn ok" data-j="OK">편집에쓰자</button>
      </div>
      <button id="btnUndoSec" class="undo hidden">↩ 직전 구간 판정 취소</button>
      <button id="btnCut" class="big cut">CUT</button>
    </div>
    <div id="memoBar" class="hidden">
      <input id="memoInput" placeholder="메모 — 지문·내용 바로 기록" autocomplete="off" enterkeyhint="send">
      <button id="memoSend">기록</button>
    </div>
    <div id="memoFeed"></div>
  </div>

  <div id="tlWrap"><div id="timeline"><div id="playhead"></div></div></div>

  <div id="takeList"></div>
</main>

<!-- CUT 판정 시트 -->
<div id="sheet" class="sheet hidden">
  <div class="sheetBox">
    <div class="sheetTitle" id="sheetTitle">테이크 판정</div>
    <div class="sheetClock" id="sheetClock">00:00:00:00</div>
    <input id="sheetNote" class="note" placeholder="노트 (선택) — 예: 인터뷰어 웃음" autocomplete="off">
    <div class="sheetBtns">
      <button class="judge keep" data-s="KEEP">특이사항</button>
      <button class="judge ng" data-s="NG">삭제</button>
      <button class="judge ok" data-s="OK">편집에쓰자</button>
    </div>
    <button id="sheetHold" class="jhold">테이크 보류 — 판정 미루기</button>
    <button id="sheetCancel" class="sheetCancel">계속 롤 (테이크 안 끝남)</button>
  </div>
</div>

<!-- 보내기 시트 -->
<div id="exportSheet" class="sheet hidden">
  <div class="sheetBox">
    <div class="sheetTitle">편집으로 보내기</div>
    <p class="hint">Premiere용 XML을 가져온 뒤 카메라 원본 파일을 연결해 주세요. 1080p 시퀀스에 판정한 구간과 메모 마커를 배치합니다. 삭제 판정 구간도 마커와 함께 남습니다. 프레임레이트는 카메라와 같게 설정해 주세요.</p>
    <div class="expBtns">
      <button id="expFcp" class="expBtn primary">Premiere XML 보내기/저장</button>
      <button id="expSrt" class="expBtn">SRT 자막 보내기/저장</button>
      <button id="expCsv" class="expBtn">CSV 보내기/저장</button>
      <button id="expAud" class="expBtn">테이크 오디오 보내기</button>
    </div>
    <button id="expCancel" class="sheetCancel">닫기</button>
  </div>
</div>

<!-- 설정 시트 -->
<div id="setSheet" class="sheet hidden">
  <div class="sheetBox">
    <div class="sheetTitle">설정</div>
    <label class="fld">프로젝트명 <input id="setProject" autocomplete="off"></label>
    <label class="fld">프레임레이트
      <select id="setFps">
        <option value="23.976">23.976</option>
        <option value="24">24</option>
        <option value="25">25</option>
        <option value="29.97">29.97</option>
        <option value="30">30</option>
        <option value="50">50</option>
        <option value="59.94">59.94</option>
        <option value="60">60</option>
      </select>
    </label>
    <label class="fld">카메라 파일명 <span class="hint">예: C0001.MP4 → 프리픽스 C, 시작번호 1</span>
      <div class="row">
        <input id="setPrefix" maxlength="4" autocomplete="off">
        <input id="setStartNo" type="number" min="0" max="9999">
      </div>
    </label>
    <label class="fld">플래시 싱크 오프셋(초) <span class="hint">카메라가 ROLL보다 먼저 돌아간 시간 — 파일 안 플래시 위치</span>
      <input id="setSync" type="number" step="0.1" min="-60" max="60">
    </label>
    <label class="fld chk"><input type="checkbox" id="setSlate"> ROLL 시작 시 화면 플래시 + 삑 소리 (슬레이트 대용)</label>
    <label class="fld chk"><input type="checkbox" id="setSound"> 버튼 진동/사운드</label>
    <label class="fld chk"><input type="checkbox" id="setMic"> 롤 중 마이크 녹음 + 박수/슬레이트 감지 (싱크용 오디오)</label>
    <p class="hint">녹음 파일은 앱을 닫으면 사라집니다. 촬영 후 오디오를 보내 주세요. CUT 판정을 기다리는 동안에도 녹음이 이어져 로그 길이보다 길 수 있습니다.</p>
    <button id="setClose" class="sheetCancel">닫기</button>
    <button id="setReset" class="danger">로그 전체 삭제</button>
  </div>
</div>

<script src="export-xml.js"></script>
<script src="app.js"></script>
</body>
</html>
